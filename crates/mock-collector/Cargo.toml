[package]
name = "mock-collector"
version = "0.1.0"
edition = "2021"

[dependencies]
gas-agent = { path = "../.." }
tokio = { version = "1.44", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
